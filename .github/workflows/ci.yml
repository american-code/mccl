name: CI

# What this can and cannot check.
#
# A GitHub runner is one machine with no Thunderbolt cable and no second node,
# so it cannot test the thing mccl exists to do. What it *can* test is
# everything below the fabric: the codecs, the reduction kernels, the planner,
# the C ABI, and the collectives over real loopback TCP — one ephemeral port and
# one socket pair per rank, which is the same code path a cluster takes. The
# cross-machine numbers come from the lab and are recorded in
# docs/ARCHITECTURE.md; nothing here pretends to reproduce them.
#
# The MLX adapter's tests skip themselves when `mlx.metallib` is absent, which
# it is here: mlx-swift compiles the MLX C++ core under SwiftPM but does not
# build the Metal shader library, and MLX's failure to find one aborts the
# process rather than throwing. The skip is checked below rather than assumed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: swift build + test (macos arm64)
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Report the toolchain
        run: |
          swift --version
          uname -m
          sw_vers

      # mlx-swift is the package's only dependency and by far the slowest part
      # of a cold build.
      - name: Cache SwiftPM build products
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        run: swift build -v 2>&1 | tail -40

      # pipefail matters here: without it the step's exit status is `tee`'s, so
      # a suite that failed to compile — or failed outright — reports success.
      - name: Test
        run: |
          set -o pipefail
          swift test 2>&1 | tee test-output.txt

      # The RDMA shim has two compilation paths, and which one this runner takes
      # depends on whether its SDK has <infiniband/verbs.h> — macOS 26.2 or
      # later. Both must work, so the one the runner did not take is built and
      # tested explicitly rather than left to chance. On an older runner this
      # re-runs the same path, which is cheap and harmless; on a newer one it is
      # the only coverage the no-header path gets.
      - name: Report which RDMA path this runner takes
        run: |
          SDK=$(xcrun --show-sdk-path)
          echo "SDK: $SDK"
          if [ -f "$SDK/usr/include/infiniband/verbs.h" ]; then
            echo "verbs.h present — the default build uses the real header"
          else
            echo "verbs.h absent — the default build uses the stub path"
          fi
          ls -l "$SDK/usr/lib/librdma.tbd" 2>&1 || true

      - name: Test the RDMA stub path (SDK without verbs.h)
        run: |
          set -o pipefail
          swift test -Xcc -DMCCL_RDMA_FORCE_STUB 2>&1 | tail -20

      # The MLX tests are allowed to skip, but only for the one reason. A skip
      # that started happening for some other reason — or a suite that silently
      # stopped containing any tests — would otherwise look like a pass.
      - name: Check the MLX tests skipped for the reason they are meant to
        if: always()
        run: |
          if grep -q "mlx.metallib is not installed" test-output.txt; then
            echo "MLX tests skipped as expected (no Metal shader library on the runner)."
          else
            echo "::warning::MLX tests did not report the expected metallib skip."
            grep -i "skip" test-output.txt || echo "no skips reported at all"
          fi

      - name: Summarise
        if: always()
        run: |
          grep -E "Executed [0-9]+ tests" test-output.txt | tail -2 >> "$GITHUB_STEP_SUMMARY" || true
